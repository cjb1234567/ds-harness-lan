name: LAN Plugin CI

on:
  push:
    branches:
      - main
    tags:
      - "v*-lan.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lan-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  quality:
    name: Check, test, and build LAN plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter './packages/**' --filter '!ds-harness-lan' -r build

      - name: Check LAN plugin types
        run: pnpm --filter ds-harness-lan check

      - name: Run LAN plugin tests
        run: pnpm --filter ds-harness-lan test

      - name: Build LAN plugin
        run: NODE_ENV=production pnpm --filter ds-harness-lan build

      - name: Verify committed GitHub plugin bundles
        run: |
          git diff --exit-code -- packages/plugin/dist/index.js packages/plugin/dist/client.github.js
          node scripts/verify-dsh-plugin.mjs
