name: LAN Plugin GitHub Release

on:
  push:
    tags:
      - "v*-lan.*"

permissions:
  contents: read

concurrency:
  group: lan-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  release:
    name: Verify and create LAN GitHub prerelease
    if: github.repository == 'cjb1234567/ds-harness-lan'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Validate LAN version and repository
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'

          const readJson = async (path) => JSON.parse(await readFile(path, 'utf8'))
          const root = await readJson('package.json')
          const plugin = await readJson('packages/plugin/package.json')
          const manifests = await Promise.all(['dsh-plugin.json', 'packages/plugin/dsh-plugin.json'].map(readJson))
          const expectedRepository = 'https://github.com/cjb1234567/ds-harness-lan'
          const versions = new Set([root.version, plugin.version, ...manifests.map((manifest) => manifest.version)])
          if (versions.size !== 1 || !/^\d+\.\d+\.\d+-lan\.\d+$/.test(plugin.version)) {
            throw new Error(`LAN versions do not match or are invalid: ${[...versions].join(', ')}`)
          }
          if (process.env.GITHUB_REF_NAME !== `v${plugin.version}`) {
            throw new Error(`Expected tag v${plugin.version}, received ${process.env.GITHUB_REF_NAME}`)
          }
          for (const pkg of [root, plugin]) {
            if (pkg.name !== 'ds-harness-lan' || pkg.repository?.url !== `git+${expectedRepository}.git`) {
              throw new Error('LAN package name or repository does not match this release.')
            }
          }
          for (const manifest of manifests) {
            if (manifest.id !== 'community.ds-harness-lan' || manifest.name !== 'ds-harness-lan' || manifest.source?.repository !== expectedRepository) {
              throw new Error('LAN plugin manifest identity or source does not match this release.')
            }
          }
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter './packages/**' --filter '!ds-harness-lan' -r build

      - name: Check LAN plugin types
        run: pnpm --filter ds-harness-lan check

      - name: Run LAN plugin tests
        run: pnpm --filter ds-harness-lan test

      - name: Build LAN plugin
        run: NODE_ENV=production pnpm --filter ds-harness-lan build

      - name: Verify committed GitHub plugin bundles
        run: |
          git diff --exit-code -- packages/plugin/dist/index.js packages/plugin/dist/client.github.js
          node scripts/verify-dsh-plugin.mjs

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DSH LAN ${{ github.ref_name }}
          prerelease: true
          body_path: .github/release-notes.md
          generate_release_notes: false
